type: object
required:
  - _id
  - name
  - email
  - phoneNumber
  - contactType
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: '+1234567890'
  email:
    description: "Contact's email"
    type: string
    example: 'john.doe@example.com'
  contactType:
    description: "Contact's type"
    type: string
    enum: [work, personal]
  isFavourite:
    description: 'Whether contact is a favourite'
    type: boolean
    example: false
  photo:
    description: "Link to contact's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
